services:
  pzserver:
    image: cm2network/steamcmd:latest
    container_name: pz-b42-server
    network_mode: host
    volumes:
      - ./pz-data:/home/steam/pzserver
      - ./pz-config:/home/steam/Zomboid
    environment:
      - USER=steam
    command: >
      bash -c "/home/steam/steamcmd/steamcmd.sh +force_install_dir /home/steam/pzserver +login anonymous +app_update 380870 -beta unstable validate +quit &&
      bash /home/steam/pzserver/start-server.sh -servername b42coop -adminpassword CHANGEME_PASSWORD"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 14G

  pz-web-backend:
    build: ./pz-web/backend
    container_name: pz-web-backend
    ports:
      - "8081:8000"
    volumes:
      - ./pz-config:/home/steam/Zomboid:ro
      - ./pz-data:/home/steam/pzserver:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PZ_CONFIG_PATH=/home/steam/Zomboid
      - SERVER_NAME=b42coop
    restart: unless-stopped

  pz-web-frontend:
    build: ./pz-web/frontend
    container_name: pz-web-frontend
    ports:
      - "80:80"
    depends_on:
      - pz-web-backend
    restart: unless-stopped
